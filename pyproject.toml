[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-refusal"
version = "0.1.0"
description = "Single-trial local VLM experiments with symbolic robot command queues"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==4.57.1",
  "Pillow==11.3.0",
  "pydantic==2.12.3",
  "huggingface-hub==0.34.3",
  "accelerate==1.9.0",
  "safetensors==0.5.3",
  "numpy==2.2.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
robot-refusal = "robot_refusal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: opt-in checks requiring the pinned local Qwen checkpoint"]
